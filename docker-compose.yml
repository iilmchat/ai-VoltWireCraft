name: voltwirecraft

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: vwc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voltwirecraft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-with-local-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-voltwirecraft}
    ports:
      - '${POSTGRES_PORT:-5436}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: vwc-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6381}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    # Опциональный S3: базовый стек поднимается без этого образа (KI-006).
    profiles: ['s3']
    image: minio/minio:latest
    container_name: vwc-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-replace-with-local-dev-user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-replace-with-local-dev-password}
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 3s
      retries: 5

  calc-engine:
    build:
      context: ./apps/calc-engine
      dockerfile: Dockerfile
    image: voltwirecraft/calc-engine:0.1.0
    container_name: vwc-calc-engine
    restart: unless-stopped
    environment:
      CALC_ENGINE_HOST: 0.0.0.0
      CALC_ENGINE_PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DWG_CONVERTER_TYPE: ${DWG_CONVERTER_TYPE:-auto}
      ODA_CONVERTER_PATH: ${ODA_CONVERTER_PATH:-}
    ports:
      - '${CALC_ENGINE_PORT:-8000}:8000'
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=2)'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: voltwirecraft/api:0.3.0
    container_name: vwc-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-voltwirecraft}:${POSTGRES_PASSWORD:-replace-with-local-dev-password}@postgres:5432/${POSTGRES_DB:-voltwirecraft}
      REDIS_URL: redis://redis:6379/0
      CALC_ENGINE_URL: http://calc-engine:8000
      # SEC-01: секреты обязательны. Никаких статических дефолтов.
      # Доставка через Docker secrets (JWT_SECRET_FILE) будет подключена DevOps (TEC-06).
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (SEC-01)}
      JWT_KID: ${JWT_KID:-v1}
      JWT_REFRESH_HASH_PEPPER: ${JWT_REFRESH_HASH_PEPPER:?JWT_REFRESH_HASH_PEPPER is required (TEC-07)}
      HITL_SIGNING_KEY: ${HITL_SIGNING_KEY:?HITL_SIGNING_KEY is required (TEC-05)}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required (TEC-06)}
      # F-04: явный список Origin для cookie-refresh; wildcard запрещён.
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:?AUTH_ALLOWED_ORIGINS is required (F-04)}
      AUTH_RATE_LIMIT_LOGIN_MAX: ${AUTH_RATE_LIMIT_LOGIN_MAX:-5}
      AUTH_RATE_LIMIT_LOGIN_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_LOGIN_WINDOW_SECONDS:-900}
      AUTH_RATE_LIMIT_REFRESH_MAX: ${AUTH_RATE_LIMIT_REFRESH_MAX:-10}
      AUTH_RATE_LIMIT_REFRESH_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_REFRESH_WINDOW_SECONDS:-300}
      AUTH_RATE_LIMIT_LOGOUT_MAX: ${AUTH_RATE_LIMIT_LOGOUT_MAX:-10}
      AUTH_RATE_LIMIT_LOGOUT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_LOGOUT_WINDOW_SECONDS:-300}
      AUTH_RATE_LIMIT_ACCOUNT_KEY: ${AUTH_RATE_LIMIT_ACCOUNT_KEY:?AUTH_RATE_LIMIT_ACCOUNT_KEY is required (F-10)}
      AUTH_RATE_LIMIT_ACCOUNT_MAX: ${AUTH_RATE_LIMIT_ACCOUNT_MAX:-20}
      AUTH_RATE_LIMIT_ACCOUNT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_ACCOUNT_WINDOW_SECONDS:-900}
      STORAGE_DRIVER: local
      LOCAL_STORAGE_DIR: /app/apps/api/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      calc-engine:
        condition: service_healthy
    ports:
      - '${API_PORT:-3000}:3000'
    volumes:
      - api-storage:/app/apps/api/storage
    # Миграции и сиды применяются до старта HTTP-сервера (идемпотентно).
    command: >
      sh -c "node dist/database/migrate.js &&
             node dist/database/seed-catalog.js &&
             node dist/database/seed-normatives.js &&
             node dist/main.js"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:3000/health").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: voltwirecraft/web:0.3.0
    container_name: vwc-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-5173}:80'

  bitrix24-mcp:
    # Опциональная интеграция с Битрикс24 (profile integrations).
    profiles: ['integrations']
    build:
      context: ./infra/mcp/bitrix24
      dockerfile: Dockerfile
    image: voltwirecraft/bitrix24-mcp:0.1.0
    container_name: vwc-bitrix24-mcp
    restart: unless-stopped
    environment:
      BITRIX24_WEBHOOK_URL: ${BITRIX24_WEBHOOK_URL:-}
      MCP_HTTP_TIMEOUT_SEC: ${MCP_HTTP_TIMEOUT_SEC:-10}
    ports:
      - '${BITRIX24_MCP_PORT:-5003}:5003'
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:5003/health", timeout=2)'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  moysklad-mcp:
    # Опциональная интеграция с МойСклад (profile integrations).
    profiles: ['integrations']
    build:
      context: ./infra/mcp/moysklad
      dockerfile: Dockerfile
    image: voltwirecraft/moysklad-mcp:0.1.0
    container_name: vwc-moysklad-mcp
    restart: unless-stopped
    environment:
      MOYSKLAD_TOKEN: ${MOYSKLAD_TOKEN:-}
      MOYSKLAD_BASE_URL: ${MOYSKLAD_BASE_URL:-https://api.moysklad.ru/api/remap/1.2}
      MCP_HTTP_TIMEOUT_SEC: ${MCP_HTTP_TIMEOUT_SEC:-10}
    ports:
      - '${MOYSKLAD_MCP_PORT:-5004}:5004'
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:5004/health", timeout=2)'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres-data:
  redis-data:
  minio-data:
  api-storage:
