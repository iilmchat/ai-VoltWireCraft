name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Актуальные версии JS-экшенов переведены на Node.js 24 без предупреждений лога.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node (typecheck / lint / test / migrations / build)
    runs-on: ubuntu-latest

    # Реальный PostgreSQL 17 + pgvector для прогона миграций и сидов (KI-002).
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: vwc
          POSTGRES_PASSWORD: vwc
          POSTGRES_DB: voltwirecraft
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vwc -d voltwirecraft"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.11.2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build shared contracts
        run: pnpm --filter @voltwirecraft/shared build

      - name: Typecheck
        run: pnpm --filter @voltwirecraft/shared typecheck && pnpm --filter api typecheck && pnpm --filter web typecheck

      - name: Test
        run: pnpm --filter @voltwirecraft/shared test && pnpm --filter api test && pnpm --filter web test

      - name: Apply migrations and seed real PostgreSQL 17 + pgvector
        env:
          DATABASE_URL: postgresql://vwc:vwc@localhost:5432/voltwirecraft
        run: |
          pnpm --filter api db:migrate
          pnpm --filter api db:seed
          pnpm --filter api db:seed:normatives

      - name: Build API
        run: pnpm --filter api build

      - name: Build Web
        run: pnpm --filter web build

  python:
    name: Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/calc-engine/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
        working-directory: apps/calc-engine

      - name: Test
        run: python -m pytest
        working-directory: apps/calc-engine

  compose:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate compose file
        run: docker compose config --quiet
