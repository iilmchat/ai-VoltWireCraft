name: CI

on:
  # Ручной прогон для проверки integration-ветки без merge в main.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Актуальные версии JS-экшенов переведены на Node.js 24 без предупреждений лога.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node (typecheck / lint / test / migrations / build)
    runs-on: ubuntu-latest

    # Реальный PostgreSQL 17 + pgvector для прогона миграций и сидов (KI-002).
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: vwc
          POSTGRES_PASSWORD: vwc
          POSTGRES_DB: voltwirecraft
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vwc -d voltwirecraft"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.11.2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build shared contracts
        run: pnpm --filter @voltwirecraft/shared build

      - name: Typecheck
        run: pnpm --filter @voltwirecraft/shared typecheck && pnpm --filter api typecheck && pnpm --filter web typecheck

      - name: Test
        run: pnpm --filter @voltwirecraft/shared test && pnpm --filter api test && pnpm --filter web test

      - name: Apply migrations and seed real PostgreSQL 17 + pgvector
        env:
          DATABASE_URL: postgresql://vwc:vwc@localhost:5432/voltwirecraft
        run: |
          pnpm --filter api db:migrate
          pnpm --filter api db:seed
          pnpm --filter api db:seed:normatives

      - name: Build API
        run: pnpm --filter api build

      - name: Build Web
        run: pnpm --filter web build

  python:
    name: Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/calc-engine/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
        working-directory: apps/calc-engine

      - name: Test
        run: python -m pytest
        working-directory: apps/calc-engine

  security:
    name: Security (SEC-01/SEC-02 QA gates)
    runs-on: ubuntu-latest
    needs: []
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: vwc
          POSTGRES_PASSWORD: vwc
          POSTGRES_DB: voltwirecraft
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vwc -d voltwirecraft"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://vwc:vwc@localhost:5432/voltwirecraft
      REDIS_URL: redis://localhost:6379/0
      CALC_ENGINE_URL: http://localhost:8000
      JWT_SECRET: ci-only-jwt-key-0123456789abcdefghijklmnopqr
      JWT_REFRESH_HASH_PEPPER: ci-only-pepper-0123456789abcdefghijklmnop
      HITL_SIGNING_KEY: ci-only-hitl-0123456789abcdefghijklmnop
      INTERNAL_SERVICE_TOKEN: ci-only-service-0123456789abcdefghijklmnop
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.11.2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared contracts
        run: pnpm --filter @voltwirecraft/shared build

      - name: Secret scanning (CI gate)
        run: node scripts/check-secrets.mjs $(git diff --name-only ${{ github.event.before }} ${{ github.sha }} || true)

      - name: Dependency audit (CI gate)
        run: pnpm audit --audit-level=high

      - name: Apply migrations on real PostgreSQL 17 + pgvector
        run: pnpm --filter api db:migrate

      - name: AppModule bootstrap gate
        run: pnpm --filter api exec vitest run test/security/s2-bootstrap.test.ts --reporter=junit --outputFile=../../artifacts/junit-bootstrap.xml

      - name: Security test suite (JUnit + coverage)
        working-directory: apps/api
        run: >-
          pnpm exec vitest run test/security
          --reporter=junit --outputFile=../../artifacts/junit-security.xml
          --coverage.enabled --coverage.reporter=json --coverage.reporter=text

      - name: Upload JUnit/coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            artifacts/**/*.xml
            apps/api/coverage/**

  integration:
    name: Integration (PostgreSQL 17 + Redis, no skips)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: vwc
          POSTGRES_PASSWORD: vwc
          POSTGRES_DB: voltwirecraft
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vwc -d voltwirecraft"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://vwc:vwc@localhost:5432/voltwirecraft
      VWC_PG17_URL: postgresql://vwc:vwc@localhost:5432/vwc_pg17_test
      VWC_REDIS_URL: redis://localhost:6379/0
      REDIS_URL: redis://localhost:6379/0
      CALC_ENGINE_URL: http://localhost:8000
      JWT_SECRET: ci-only-jwt-key-0123456789abcdefghijklmnopqr
      JWT_REFRESH_HASH_PEPPER: ci-only-pepper-0123456789abcdefghijklmnop
      HITL_SIGNING_KEY: ci-only-hitl-0123456789abcdefghijklmnop
      INTERNAL_SERVICE_TOKEN: ci-only-service-0123456789abcdefghijklmnop
      AUTH_ALLOWED_ORIGINS: http://localhost:5173
      AUTH_RATE_LIMIT_ACCOUNT_KEY: ci-only-account-key-0123456789abcdefghijklmnop
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.11.2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared contracts
        run: pnpm --filter @voltwirecraft/shared build

      - name: Verify mandatory CI services and isolated database
        run: |
          test -n "${VWC_PG17_URL:?VWC_PG17_URL is mandatory in CI}"
          test -n "${VWC_REDIS_URL:?VWC_REDIS_URL is mandatory in CI}"
          PGPASSWORD=vwc psql -h localhost -U vwc -d voltwirecraft -Atc "select version()" | grep -q "PostgreSQL 17"
          redis-cli -u "$VWC_REDIS_URL" ping | grep -q PONG
          PGPASSWORD=vwc psql -h localhost -U vwc -d voltwirecraft -Atc \
            "SELECT 1 FROM pg_database WHERE datname = 'vwc_pg17_test'" | grep -q 1 || \
            PGPASSWORD=vwc createdb -h localhost -U vwc vwc_pg17_test

      - name: Apply migrations on main test database
        run: pnpm --filter api db:migrate

      - name: Full API suite on real PostgreSQL 17 and Redis
        working-directory: apps/api
        run: pnpm exec vitest run --reporter=junit --outputFile=../../artifacts/junit-integration.xml

      - name: Enforce mandatory integration tests (no skips)
        run: node scripts/assert-ci-junit.mjs artifacts/junit-integration.xml

      - name: Upload integration JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-reports
          path: artifacts/junit-integration.xml

  smoke:
    name: E2E smoke (Bearer)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Start stack
        run: docker compose up -d --build
      - name: Run smoke with Bearer
        run: pnpm smoke:e2e

  compose:
    name: Docker Compose config
    runs-on: ubuntu-latest
    env:
      # Dummy значения только для валидации синтаксиса compose (SEC-01).
      JWT_SECRET: ci-only-jwt-key-0123456789abcdefghijklmnopqr
      JWT_REFRESH_HASH_PEPPER: ci-only-pepper-0123456789abcdefghijklmnop
      HITL_SIGNING_KEY: ci-only-hitl-0123456789abcdefghijklmnop
      INTERNAL_SERVICE_TOKEN: ci-only-service-0123456789abcdefghijklmnop
      AUTH_RATE_LIMIT_ACCOUNT_KEY: ci-only-account-key-0123456789abcdefghijklmnop
      # Не секрет: только для валидации синтаксиса compose.
      AUTH_ALLOWED_ORIGINS: http://localhost:5173
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate compose file
        run: docker compose config --quiet
