[package]
name = "voltwirecraft"
version = "0.8.0"
description = "Десктопное приложение VoltWireCraft (Tauri)"
authors = ["RuChating (iilmchat)"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# Автообновление доступно только на десктопных целях (RULES § 5.4).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
